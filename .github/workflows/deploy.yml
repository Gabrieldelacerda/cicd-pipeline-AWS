name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Build test image
        run: docker build -t cicd-pipeline-aws:test .

      - name: Run test container
        run: docker run -d --name cicd-test -p 5000:5000 cicd-pipeline-aws:test

      - name: Test application
        run: |
          curl --fail \
            --retry 10 \
            --retry-delay 2 \
            --retry-connrefused \
            http://127.0.0.1:5000

      - name: Clean up
        if: always()
        run: docker rm -f cicd-test || true

  publish-and-deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.ENABLE_EC2_DEPLOY == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/cicd-pipeline-aws:latest
            ${{ secrets.DOCKER_USERNAME }}/cicd-pipeline-aws:${{ github.sha }}

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" | base64 -d > ~/.ssh/ec2_key
          chmod 600 ~/.ssh/ec2_key
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy to EC2
        run: |
          ssh -i ~/.ssh/ec2_key ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} "
            docker pull ${{ secrets.DOCKER_USERNAME }}/cicd-pipeline-aws:${{ github.sha }} &&
            docker stop cicd-app || true &&
            docker rm cicd-app || true &&
            docker run -d \
              --restart unless-stopped \
              --name cicd-app \
              -p 5000:5000 \
              ${{ secrets.DOCKER_USERNAME }}/cicd-pipeline-aws:${{ github.sha }}
          "
